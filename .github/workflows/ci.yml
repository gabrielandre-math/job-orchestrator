name: ci

on:
  push:
    branches: [main]
    paths: ['backend/**', 'web/**', 'extension/**', 'tests/extension/**', 'scripts/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['backend/**', 'web/**', 'extension/**', 'tests/extension/**', 'scripts/**', '.github/workflows/ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: jo_test
          POSTGRES_USER: jo
          POSTGRES_PASSWORD: jo-test
        ports: ['5463:5432']
        options: >-
          --health-cmd "pg_isready -U jo -d jo_test" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
      - name: Build
        working-directory: backend
        run: dotnet build JobOrchestrator.slnx -warnaserror
      - name: Unit tests
        working-directory: backend
        run: dotnet test tests/JobOrchestrator.Tests --no-build --filter "Category!=E2E"
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-ui
      - name: Database and flow tests
        env:
          JO_WEB_TEST_ROOT: ${{ github.workspace }}/web-ui
          JO_UI_SCREENSHOTS: ${{ github.workspace }}/ui-screenshots
        working-directory: backend
        run: dotnet test tests/JobOrchestrator.Tests --no-build --filter "Category=E2E"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ui-screenshots
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Build
        working-directory: web
        run: npx ng build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/dist/app/browser
          if-no-files-found: error
      - name: Extension extraction tests
        run: npm ci --prefix tests/extension && npm test --prefix tests/extension
