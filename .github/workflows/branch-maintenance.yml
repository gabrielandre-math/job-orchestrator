name: Branch maintenance

on:
  push:
    branches: [main]
    paths: ['.github/workflows/branch-maintenance.yml']

permissions:
  contents: write

jobs:
  remove-obsolete-merged-references:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const aliases = [
              ['6fc5315a61ae88d95864f4f962a6ec6e51d5eb5f', 'feature/captcha-lab'],
              ['1b927ff2a11a1b8cf60533a01dc4844576e05a3d', 'feature/candidate-workflow'],
              ['2e094a7cf0781986a50efb8a98fea19ccf748a23', 'feature/linkedin-captcha'],
              ['1f2068b1f0062ef58699caabc2e4d049f3aa1302', 'docs/functional-audit']
            ];
            const repo = context.repo;
            const branches = await github.paginate(github.rest.repos.listBranches, { ...repo, per_page: 100 });
            let removed = 0;
            for (const [sha, alias] of aliases) {
              const replacement = branches.find(b => b.name === alias);
              if (!replacement || replacement.commit.sha !== sha) throw new Error('Replacement reference does not match the verified commit.');
              const comparison = await github.rest.repos.compareCommitsWithBasehead({ ...repo, basehead: sha + '...' + context.sha });
              if (!['ahead', 'identical'].includes(comparison.data.status)) throw new Error('Verified commit is not integrated in the default branch.');
              const obsolete = branches.filter(b => b.commit.sha === sha && b.name !== alias && b.name !== 'main' && !b.protected && !/^(feature|fix|docs|release)\//.test(b.name));
              if (obsolete.length > 1) throw new Error('Ambiguous references; no automatic deletion.');
              for (const branch of obsolete) {
                await github.rest.git.deleteRef({ ...repo, ref: 'heads/' + branch.name });
                removed++;
              }
            }
            core.info('Removed ' + removed + ' obsolete merged references; verified replacements and default-branch history were retained.');
